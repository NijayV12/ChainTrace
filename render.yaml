services:
  - type: web
    name: chaintrace-api
    env: node
    rootDir: .
    buildCommand: cd ai_engine && npm install && npm run build && cd ../backend && npm install && npm run build
    startCommand: cd backend && npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: BLOCKCHAIN_DATA_DIR
        value: ./data/chain
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: AI_ENGINE_URL
        sync: false
      - key: AI_ENGINE_TIMEOUT_MS
        value: "5000"
      - key: AI_ENGINE_PORT
        value: "4010"
      - key: AI_ENGINE_PYTHON_URL
        sync: false
